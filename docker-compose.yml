services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jayhun
      POSTGRES_USER: jayhun
      POSTGRES_PASSWORD: change_this_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jayhun -d jayhun"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://jayhun:change_this_local_password@db:5432/jayhun
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
